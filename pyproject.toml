[project]
name = "sorot"
version = "1.0.0"
description = "Deteksi promosi saham terkoordinasi dan risiko kepemilikan saham IDX dari data publik"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv", "data", "logs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "SIM"]
ignore = [
    "E501",    # baris panjang dibatasi line-length, bukan per baris
    "B905",    # zip() sengaja dipakai untuk pasangan berurutan (dates, dates[1:])
    "SIM401",  # .get() pada DataFrame mengembalikan kolom, ditulis eksplisit agar jelas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # fixture pytest diimpor lalu dipakai sebagai argumen
